name: Test

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velarys
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - name: Build de l'image (sans publication)
        run: docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=test -t velarys-ha-addon:test .
