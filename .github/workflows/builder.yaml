name: Builder

# Publie l'image de l'add-on quand la version de velarys/config.yaml change sur main (canal stable)
# ou sur beta (canal bêta, versions en `x.y.z-beta.N`). Une version déjà publiée n'est jamais
# reconstruite (skip-existing). Seul main déplace l'étiquette `latest`.
on:
  push:
    branches: [main, beta]
    paths:
      - velarys/config.yaml
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: velarys-ha-addon
  # GHCR exige un nom en minuscules (l'org s'écrit Velarys-org).
  REGISTRY_PREFIX: ghcr.io/velarys-org

permissions:
  contents: read

jobs:
  init:
    name: Préparer le build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(yq -r '.version' velarys/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Image ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: velarys
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            ${{ github.ref_name == 'main' && 'latest' || '' }}
          build-args: |
            BUILD_VERSION=${{ needs.init.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          push: "true"
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Manifeste multi-arch
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            ${{ github.ref_name == 'main' && 'latest' || '' }}
          skip-existing: ${{ needs.init.outputs.version }}
