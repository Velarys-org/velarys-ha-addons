        <p class="sub" data-t="subtitle"></p>
      </header>

      <h1 class="title" data-t="title"></h1>

      <!-- Actions : trois grandes cartes, pictogrammes pleins, une phrase chacune. -->
      <section class="actions-grid" aria-labelledby="actions-title">
        <h2 id="actions-title" class="visually-hidden" data-t="actionsTitle"></h2>
        <button type="button" class="action" data-kind="assistance">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z" /></svg>
          </span>
          <span class="action-title" data-t="ctaAssistance"></span>
          <span class="action-hint" data-t="ctaAssistanceHint"></span>
        </button>
        <button type="button" class="action" data-kind="evolution">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z" /></svg>
          </span>
          <span class="action-title" data-t="ctaEvolution"></span>
          <span class="action-hint" data-t="ctaEvolutionHint"></span>
        </button>
        <button type="button" class="action" data-kind="intervention" disabled aria-describedby="soon">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" /></svg>
          </span>
          <span class="action-title" data-t="ctaIntervention"></span>
          <span class="action-hint" data-t="ctaInterventionHint"></span>
          <span class="soon" id="soon" data-t="soon"></span>
        </button>
      </section>

      <section class="requests" aria-labelledby="list-title">
        <h2 id="list-title" data-t="listTitle"></h2>
        <p class="status" id="list-status" role="status"></p>
        <ul class="tickets" id="tickets"></ul>
      </section>

      <p class="urgent-line"><strong data-t="urgentTitle"></strong> <span data-t="urgentText"></span></p>
    </main>

    <!-- Nouvelle demande -->
    <dialog id="new-dialog" aria-labelledby="new-title">
      <form id="new-form" method="dialog" novalidate>
        <div class="dialog-head">
          <h2 id="new-title"></h2>
          <button type="button" class="close" data-close aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          </button>
        </div>
        <label for="new-message" class="field-label" id="new-label"></label>
        <textarea id="new-message" rows="7" maxlength="4000"></textarea>
        <div class="field-foot">
          <span data-t="privacyHint"></span>
          <span class="counter" id="new-counter" aria-live="polite"></span>
        </div>
        <p class="urgent" role="note"><strong data-t="urgentTitle"></strong> <span data-t="urgentText"></span></p>
        <p class="status" id="new-status" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-close data-t="cancel"></button>
          <button type="submit" class="btn" id="new-send" data-t="send"></button>
        </div>
        <p class="fine" data-t="encryption"></p>
      </form>
    </dialog>

    <!-- Une demande et son fil -->
    <dialog id="thread-dialog" aria-labelledby="thread-title">
      <div class="dialog-head">
        <div>
          <h2 id="thread-title"></h2>
          <p class="thread-meta" id="thread-meta"></p>
        </div>
        <button type="button" class="close" data-close aria-label="Fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
      </div>
      <ol class="thread" id="thread"></ol>
      <form id="reply-form" novalidate>
        <label for="reply-message" class="field-label" data-t="replyLabel"></label>
        <textarea id="reply-message" rows="3" maxlength="4000"></textarea>
        <p class="status" id="reply-status" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn" id="reply-send" data-t="send"></button>
        </div>
      </form>
      <p class="closed-note" id="closed-note" data-t="closedNote"></p>
    </dialog>

    <noscript>Velarys&nbsp;: JavaScript est nécessaire pour envoyer une demande.</noscript>
    <script src="panel.js"></script>
  </body>
</html>
