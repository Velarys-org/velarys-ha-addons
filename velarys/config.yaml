name: Suivi et Maintenance (bêta)
version: "0.3.0-beta.9"
slug: velarys
# Canal bêta : cette branche `beta` du dépôt, que seuls les hubs de test ajoutent
# (`https://github.com/Velarys-org/velarys-ha-addons#beta`). Les clients suivent `main`.
stage: experimental
description: Velarys repère les pannes de votre installation, sans rien savoir de la vie du logement
# Lien « Visitez la page … » de l'onglet Info : la page de suivi du site (noindex), pas le code.
url: https://www.velarys.fr/suivi
arch:
  - aarch64
  - amd64
image: ghcr.io/velarys-org/velarys-ha-addon
startup: services
boot: auto
# Panneau « Velarys » de la barre latérale (demandes d'assistance et idées d'évolution). Servi par
# l'ingress du Supervisor, jamais publié sur l'hôte ; réservé aux administrateurs de HA (défaut).
ingress: true
ingress_port: 8099
panel_icon: mdi:alpha-v-box
panel_title: Velarys
# Lecture de l'état (versions, santé) et du proxy de Core pour savoir si Home Assistant répond.
hassio_api: true
hassio_role: default
homeassistant_api: true
# La clé privée du hub ne part jamais dans une sauvegarde : une restauration demande un nouvel
# enrôlement, et une sauvegarde restaurée sur une autre machine ne clone pas l'identité.
# Le Supervisor compare chaque motif au chemin complet (PurePath.match), d'où les deux formes.
backup_exclude:
  - identity
  - identity/*
options:
  central_url: https://hub.velarys.fr
  enrollment_code: ""
  hub_name: ""
  heartbeat_interval: 300
  log_level: info
schema:
  central_url: url
  enrollment_code: str?
  hub_name: str?
  heartbeat_interval: int(60,3600)
  log_level: list(debug|info|warning|error)
